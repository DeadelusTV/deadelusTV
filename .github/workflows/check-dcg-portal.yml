name: Verifier la structure du portail DCG

on:
  push:
    branches:
      - developpement/tcg-attente
  pull_request:
    paths:
      - public/admin/dcg-auth.*
      - public/assets/dcg-admin-auth.js
      - public/_headers
      - scripts/test_dcg_admin*.cjs
      - public/index.html
      - public/assets/app.js
      - public/assets/site-auth.js
      - public/assets/daily-pass.*
      - public/modules/dcg/**
      - scripts/test_dcg_portal.cjs
      - package.json
      - package-lock.json
      - public/package*.json
      - scripts/hold-dcg-portal-publication.cjs
      - scripts/test_portal*.cjs
      - scripts/helpers/**
      - scripts/test_portal_stock.cjs
      - scripts/test_portal_live.cjs
      - functions/api/dcg-live-status.js
      - functions/api/dcg-publication-hold.js
      - scripts/test_profile_progress.cjs
      - scripts/test_dcg_profile.cjs
      - scripts/test_daily_pass.cjs
      - .github/workflows/check-dcg-portal.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recuperer la branche de test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true
      - name: Installer uniquement les dépendances de test
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verifier les fichiers statiques
        run: python3 scripts/verify-static.py
      - name: Verifier la syntaxe
        run: |
          node --check public/modules/dcg/config.js
          node --check public/modules/dcg/portal.js
          node --check public/modules/dcg/portal-stock.js
          node --check public/modules/dcg/portal-live.js
          node --check functions/api/dcg-live-status.js
          node --check public/modules/dcg/dcg-xp-rewards.js
          node --check public/modules/dcg/profile.js
          node --check public/modules/dcg/profile-rewards.js
          node --check public/modules/dcg/dcg-xp-pass.js
          node --check public/assets/app.js
          node --check public/assets/dcg-admin-auth.js
          node --check public/modules/dcg/portal-session.js
          node --check public/assets/site-auth.js
          node --check public/assets/daily-pass.js
      - name: Tester portail, routage et consentements existants
        run: node --test scripts/test_dcg_admin_auth.cjs scripts/test_dcg_admin_sessions.cjs scripts/test_dcg_admin_account_access.cjs scripts/test_portal_multi_dcg.cjs scripts/test_portal_session_resume.cjs scripts/test_portal_common.cjs scripts/test_dcg_portal.cjs scripts/test_dcg_profile.cjs scripts/test_profile_progress.cjs scripts/test_portal_stock.cjs scripts/test_portal_live.cjs scripts/test_daily_pass.cjs scripts/test_frontend_consent.cjs scripts/test_twitch_floating.cjs scripts/test_journal_account_access.cjs
