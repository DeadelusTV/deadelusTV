<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="La petite ombre curieuse">
<defs>
  <radialGradient id="body" cx=".43" cy=".48" r=".72"><stop stop-color="#202334"/><stop offset=".55" stop-color="#0c101a"/><stop offset="1" stop-color="#03050a"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#c99b5c" stop-opacity=".65"/><stop offset=".4" stop-color="#596078" stop-opacity=".13"/><stop offset="1" stop-color="#04060c" stop-opacity="0"/></linearGradient>
  <radialGradient id="eye" cx=".35" cy=".23" r=".79"><stop stop-color="#fff1b8"/><stop offset=".34" stop-color="#f4c46c"/><stop offset=".73" stop-color="#bd7931"/><stop offset="1" stop-color="#59311a"/></radialGradient>
  <linearGradient id="metal" x1="0" x2="1" y2="1"><stop stop-color="#fff0b8"/><stop offset=".4" stop-color="#d29b48"/><stop offset="1" stop-color="#74502a"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="1.9"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
  #eyes{transform-box:fill-box;transform-origin:center;animation:blink 8.1s infinite}
  @keyframes blink {0%,43%,45%,100%{transform:scaleY(1)}44%{transform:scaleY(.12)}}
  @media(prefers-reduced-motion:reduce){#eyes{animation:none}}
</style>
<!-- une traîne d'ombre, puis une petite silhouette féline abstraite -->
<path d="M40 113C19 119 18 103 26 96c9-8 19 0 14 9 21-10 24 23 3 30-19 6-33-9-29-23" fill="none" stroke="#080b13" stroke-width="13" stroke-linecap="round"/>
