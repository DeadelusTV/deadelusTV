<ellipse cx="83" cy="126" rx="50" ry="24" fill="#050710" opacity=".65" filter="url(#soft)"/>
<path d="M42 125c-13-16-10-42 0-57 6-10 13-15 17-27-2 3-14 5-15-6 13 8 20-12 34-14-8-1-13-8-7-14 1 10 15 12 19 23C99 21 91 6 102 6c-6 9 13 19 7 38 11-11 10-21 5-27 18 4 19 28 8 42 22 15 28 42 15 65-19 28-75 32-95 1z" fill="url(#body)" stroke="#3c3f4e" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M49 58c12-15 17-26 32-25 8-4 13 2 20 8 8-12 2-23 2-23" fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round"/>
<path d="M44 90c-6 28 2 42 18 50M123 74c17 20 15 42 4 55" stroke="#8a7052" stroke-opacity=".22" stroke-width="1.7" fill="none"/>
<!-- yeux ambrés, très lisibles quand on ne voit que la tête -->
<g id="eyes">
<ellipse cx="62" cy="92" rx="15.6" ry="19.3" fill="#09080d"/>
<ellipse cx="99" cy="92" rx="15.6" ry="19.3" fill="#09080d"/>
<ellipse cx="62" cy="92" rx="11.4" ry="15.4" fill="#a5672d" opacity=".43" filter="url(#glow)"/>
<ellipse cx="99" cy="92" rx="11.4" ry="15.4" fill="#a5672d" opacity=".43" filter="url(#glow)"/>
<ellipse cx="62" cy="92" rx="11.1" ry="15.2" fill="url(#eye)"/>
<ellipse cx="99" cy="92" rx="11.1" ry="15.2" fill="url(#eye)"/>
<ellipse cx="65" cy="94" rx="4.1" ry="9" fill="#151018"/>
<ellipse cx="96" cy="94" rx="4.1" ry="9" fill="#151018"/>
<circle cx="57" cy="84" r="3.1" fill="#fff8e9" opacity=".9"/>
<circle cx="104" cy="84" r="3.1" fill="#fff8e9" opacity=".9"/>
</g>
<path d="M78 111q3-2 6 0" stroke="#b89a72" stroke-width="1.2" stroke-linecap="round" opacity=".6" fill="none"/>
<!-- petites pattes -->
<ellipse cx="52" cy="133" rx="14" ry="11" fill="#090c14" stroke="#333344" stroke-width="1"/>
<ellipse cx="111" cy="133" rx="14" ry="11" fill="#090c14" stroke="#333344" stroke-width="1"/>
<path d="M45 134v3m7-3v3m52-3v3m7-3v3" stroke="#747287" opacity=".35" stroke-width="1" stroke-linecap="round"/>
